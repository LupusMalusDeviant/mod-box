name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Validate and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # A download on the runner can hang (once 13 minutes on Windows): each try gets 4 minutes,
      # a hung one is tried once more, and the step gives up after 10.
      - name: Install Claude Code
        shell: bash
        timeout-minutes: 10
        run: |
          for try in 1 2; do
            timeout 240 npm install -g @anthropic-ai/claude-code && exit 0
            echo "::warning::npm install failed or hung (try $try)"
          done
          exit 1

      - name: Generated files are up to date
        shell: bash
        run: |
          node tools/box.mjs build
          git diff --exit-code -- . ':(exclude).claude-plugin/types'

      - name: Validate the plugin
        run: claude plugin validate .

      - name: Plugin tests
        run: claude plugin test .

      - name: Tool tests
        run: node --test tools/box.test.mjs

      - name: Lifecycle of foreign mods (inspect, import, rollback, update, remove)
        run: node --test tools/lifecycle.test.mjs

      - name: Native plugin management (isolated Claude Code profile)
        run: node --test tools/native.test.mjs
